server {
    listen 80;
    server_name ouralisten.bcmelias.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ouralisten.bcmelias.com;

    ssl_certificate /etc/letsencrypt/live/ouralisten.bcmelias.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ouralisten.bcmelias.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /policy/ {
        root /www;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5000;
    }

    location = /oura-webhook {
        proxy_pass http://127.0.0.1:5000;
    }

    location ~ ^/(trbd|aa|percept|emu|utah)/(authorize|callback)$ {
        proxy_pass http://127.0.0.1:5000;
    }
}
